spring.application.name=securevault-backend

server.port=${PORT:8080}

# ==============================
# DATABASE CONFIGURATION
# Default: Embedded persistent H2 database (Zero setup required)
# To use PostgreSQL, set SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/securevault
# ==============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/securevault_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=PostgreSQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (dev only — disabled when RENDER env is present)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ==============================
# JWT CONFIGURATION
# Set JWT_SECRET env var in production — must be >= 32 characters
# ==============================
jwt.secret=${JWT_SECRET:SecureVaultJwtSecretKey2024MustBeAtLeast32Bytes!}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ==============================
# AES-256 ENCRYPTION
# Set ENCRYPTION_KEY env var in production — must be exactly 32 characters
# ==============================
encryption.key=${ENCRYPTION_KEY:SecureVaultEncryptionKey2026ABCD}

# ==============================
# CORS CONFIGURATION
# ==============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==============================
# FRONTEND BASE URL (used in email links, e.g. password reset)
# ==============================
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ==============================
# MAIL CONFIGURATION
# Set MAIL_USERNAME and MAIL_PASSWORD env vars to enable real email delivery.
# If not set, email notifications are logged to console only (dev mode).
# ==============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Disable mail auto-config when credentials are not provided
spring.mail.test-connection=false